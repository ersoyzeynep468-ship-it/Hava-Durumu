$('days').onclick=e=>{const b=e.target.closest('button');if(b){selDay=+b.dataset.i;document.querySelectorAll('#days button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderHours()}};
function render(){selDay=0;const c=D[city],[dt,w]=c.ds[dist];W=w;if(w==='rainy')UT=performance.now();setP();posBubble();document.body.dataset.w=w;
 $('cities').innerHTML=Object.keys(D).map(n=>`<button aria-pressed="${n===city}" data-c="${n}">${n}</button>`).join('');
 $('dists').innerHTML=Object.keys(c.ds).map(n=>`<button aria-pressed="${n===dist}" data-d="${n}">${n}</button>`).join('');
 $('hd').textContent=`${dist}, ${city}`;$('temp').textContent=(c.t+dt)+'°';$('wn').textContent=NAMES[w];MSGNOW=(w==='sunny'&&c.t+dt>=28)?'Çok sıcak! Bol su içelim.':MSG[w];$('msg').textContent=MSGNOW;
 $('hearts').textContent='♥'.repeat(HEART[w])+'♡'.repeat(3-HEART[w]);
 $('foot').innerHTML=`<span>NEM %${c.h}</span><span>RÜZGAR ${c.r}</span><span>UV ${c.u}</span>`;
 const now=new Date();
 $('days').innerHTML=c.f.map((d,i)=>{const dd=new Date(now.getTime()+i*864e5);
  const nm=DN[i]=i===0?'Bugün':i===1?'Yarın':dd.toLocaleDateString('tr-TR',{weekday:'long'});
  return `<button class="day" data-i="${i}" aria-pressed="${i===0}"><span>${nm}</span><canvas width="16" height="16" data-i="${i}"></canvas><span>${d[1]+dt}° / ${d[2]+dt}°</span></button>`}).join('');
 document.querySelectorAll('#days canvas').forEach(cv=>icon(cv,c.f[cv.dataset.i][0]));renderHours();
 if(reduce)frame(0,0)}
$('cities').onclick=e=>{const b=e.target.closest('button');if(b){city=b.dataset.c;dist=Object.keys(D[city].ds)[0];render()}};
$('dists').onclick=e=>{const b=e.target.closest('button');if(b){dist=b.dataset.d;render()}};
function matches(){const v=norm($('q').value.trim());return v?TR.filter(n=>norm(n).includes(v)).slice(0,6):[]}
function pick(n){if(!D[n])D[n]=mk(n);city=n;dist=Object.keys(D[n].ds)[0];$('q').value='';$('res').innerHTML='';render()}
$('q').oninput=()=>{const m=matches();$('res').innerHTML=m.length?m.map(n=>`<button data-s="${n}">${n}</button>`).join(''):$('q').value.trim()?'<span class="nf">Bulunamadı. Şimdilik Türkiye illeri aranabiliyor.</span>':''};
$('q').onkeydown=e=>{if(e.key==='Enter'){const m=matches();if(m[0])pick(m[0])}};
$('res').onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.s)};
const tick=()=>{$('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})};
tick();setInterval(tick,10000);resize();render();if(!reduce)requestAnimationFrame(loop);
</script></body></html>
